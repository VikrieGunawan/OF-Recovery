name: Build OF Recovery APK

# Build berjalan MANUAL — tekan tombol "Run workflow" di tab Actions,
# pilih varian (debug/release), lalu unduh APK dari section Artifacts.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK variant to build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Prepare release keystore (optional)
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.APK_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "FOX_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "FOX_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "FOX_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FOX_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "Keystore prepared — release will be signed."
          else
            echo "No APK_KEYSTORE_BASE64 secret found — release APK will fall back to the debug key."
          fi

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OF-Recovery-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
